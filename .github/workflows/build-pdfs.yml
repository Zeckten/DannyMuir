name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - ".github/workflows/build-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile resume and CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume.tex
            cv.tex
          latexmk_use_xelatex: false

      - name: Commit compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.pdf cv.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Recompile PDFs from latest source [skip ci]"
            git push
          fi

      # Publish the PDFs as a GitHub Release so these links always serve the newest build:
      #   https://github.com/Zeckten/DannyMuir/releases/latest/download/cv.pdf
      #   https://github.com/Zeckten/DannyMuir/releases/latest/download/resume.pdf
      - name: Compute release tag
        id: tag
        run: echo "tag=v$(date -u +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CV & Resume ${{ steps.tag.outputs.tag }}
          files: |
            cv.pdf
            resume.pdf
          make_latest: true

      - name: Trigger website redeploy
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
